<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spellroot Chronicles</title>

    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="png" sizes="32x32" href="img/favicon.png">

    <script src="/classes/drawable-object.class.js"></script>
    <script src="/classes/movable-object.class.js"></script>
    <script src="/classes/status-bar.class.js"></script>
    <script src="/classes/collectable-bar.class.js"></script>
    <script src="/classes/potion-bar.class.js"></script>
    <script src="/classes/character.class.js"></script>
    <script src="/classes/collectable-object.class.js"></script>
    <script src="/classes/throwable-objects.class.js"></script>
    <script src="/classes/potion-bottle.class.js"></script>
    <script src="/classes/scroll-object.class.js"></script>
    <script src="/classes/sound-button.class.js"></script>
    <script src="/classes/fullscreen-button.class.js"></script>
    <script src="/classes/enemie.class.js"></script>
    <script src="/classes/cloud.class.js"></script>
    <script src="/classes/world.class.js"></script>
    <script src="/classes/keyboard.class.js"></script>
    <script src="/classes/background-object.class.js"></script>
    <script src="/classes/level.class.js"></script>
    <script src="/classes/endboss.class.js"></script>
    <script src="/js/levels/level1.js"></script>
    <script src="/classes/enemie-level2.class.js"></script>
    <script src="/classes/ork-enemie-level2.class.js"></script>
    <script src="/classes/endboss-level2.class.js"></script>
    <script src="/js/levels/level2.js"></script>
    <script src="/js/fullscreen.js"></script>
    <script src="/js/game.js"></script>

</head>

<body onload="initializeGame()">

    <h1>Spellroot Chronicles</h1>
    <div id="fullscreen">
        <div id="canvas-wrapper">
            <canvas id="gameCanvas" width="720" height="480"></canvas>

            <div id="mobile-controls">
                <div class="mobile-controls-group">
                    <button id="mobile-btn-left" class="mobile-control-btn"><img src="img/btn-move-left.png" alt="Links"></button>
                    <button id="mobile-btn-right" class="mobile-control-btn"><img src="img/btn-move-right.png" alt="Rechts"></button>
                </div>
                <div class="mobile-controls-group">
                    <button id="mobile-btn-jump" class="mobile-control-btn"><img src="img/btn-jump.png" alt="Springen"></button>
                    <button id="mobile-btn-throw" class="mobile-control-btn"><img src="img/btn-throw.png" alt="Werfen"></button>
                </div>
            </div>
        </div>
    </div>

    <div id="rotate-device-message">Turn your Device to play</div>

</body>

</html>
